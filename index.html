<div class="app">

  <!-- ============================== header ============================= -->
  <header class="hdr" id="hdr">
    <div class="hdr-in">
      <div class="hdr-brand">
        <span class="hdr-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 19.5h19L14 7l-3.2 5.4L8.4 9 2.5 19.5Z" fill="#fff"/><circle cx="18.4" cy="6.6" r="2.3" fill="#fff" opacity=".9"/></svg>
        </span>
        <div class="hdr-title">
          <b>瑞士行 · 工作台</b>
          <span id="hdrSub">4–11 Oct 2026 · 8 天 7 晚</span>
        </div>
      </div>
      <div class="hdr-right">
        <div class="clock">
          <b id="clockTime">--:--</b>
          <span id="clockZone">瑞士时间</span>
        </div>
        <div class="clock clock-bj" id="bjClock">
          <b id="bjTime">--:--</b>
          <span id="bjZone">🇨🇳 北京时间</span>
        </div>
      </div>
    </div>
    <div class="offline" id="offlineBar">
      <svg width="14" height="14"><use href="#i-wifi-off"/></svg>
      <span>离线模式 · 行程与票据仍可查看</span>
    </div>
  </header>

  <main>
    <!-- ============================ TODAY ============================= -->
    <section class="view is-active" id="view-today" data-view="today">
      <div class="hero" id="hero"></div>
      <div class="dayscroll" id="dayChips"></div>
      <div id="todayBody"></div>
    </section>

    <!-- =========================== ITINERARY ========================== -->
    <section class="view" id="view-itin" data-view="itin">
      <div class="pad" style="padding-top:14px">
        <div class="seg" id="itinSeg">
          <button class="is-on" data-mode="cards">卡片</button>
          <button data-mode="table">总览表</button>
        </div>
      </div>
      <div id="itinBody"></div>
    </section>

    <!-- ============================= MAP ============================== -->
    <section class="view" id="view-map" data-view="map">
      <div style="padding-top:12px">
        <div class="mapwrap full" style="position:relative">
          <div class="map-overlay top">
            <div class="map-legend" id="mapLegend"></div>
          </div>
          <div id="map"></div>
        </div>
      </div>
      <div class="sec" style="margin-top:18px">
        <div class="sec-head"><h2 id="mapListTitle">本日地点</h2><span class="more" id="mapCount"></span></div>
        <div class="card"><div class="card-bd tight" id="mapPlaces"></div></div>
      </div>
      <div class="sec">
        <div class="card">
          <div class="card-bd">
            <div class="btn-row" id="mapPhotoBar"></div>
            <div class="btn-row" style="margin-top:9px">
              <button class="btn sm ghost" data-map-action="fit">缩放到全部</button>
              <button class="btn sm ghost" data-map-action="route">显示路线</button>
              <button class="btn sm ghost" data-map-action="suggest">建议路线</button>
              <button class="btn sm ghost" data-map-action="terrain">切换地形图</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================== TRANSLATE ========================== -->
    <section class="view" id="view-translate" data-view="translate">
      <div id="translateBody"></div>
    </section>

    <!-- ============================ WALLET ============================ -->
    <section class="view" id="view-wallet" data-view="wallet">
      <div style="padding-top:14px">
        <div class="pad">
          <div class="seg" id="walletSeg">
            <button class="is-on" data-mode="ledger">记账</button>
            <button data-mode="tickets">票据</button>
          </div>
        </div>
      </div>
      <div id="walletBody"></div>
    </section>

    <!-- ============================= MORE ============================= -->
    <section class="view" id="view-more" data-view="more">
      <div id="moreBody"></div>
    </section>
  </main>

  <!-- ========================== bottom nav =========================== -->
  <nav class="nav">
    <div class="nav-in" id="nav">
      <button data-go="today" class="is-on"><svg><use href="#i-today"/></svg><span>今日</span></button>
      <button data-go="itin"><svg><use href="#i-route"/></svg><span>行程</span></button>
      <button data-go="map"><svg><use href="#i-map"/></svg><span>地图</span></button>
      <button data-go="translate"><svg><use href="#i-globe"/></svg><span>翻译</span></button>
      <button data-go="wallet"><svg><use href="#i-wallet"/></svg><span>钱包</span></button>
      <button data-go="more"><svg><use href="#i-more"/></svg><span>更多</span></button>
    </div>
  </nav>

  <!-- FAB -->
  <button class="fab" id="fab" hidden>
    <svg><use href="#i-plus"/></svg><span>记一笔</span>
  </button>

  <!-- ============================== sheet ============================ -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-hd">
      <div>
        <h3 id="sheetTitle">标题</h3>
        <div class="sub" id="sheetSub"></div>
      </div>
      <button class="sheet-x" id="sheetX" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-bd" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/services.js"></script>
<script src="assets/js/weather.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
